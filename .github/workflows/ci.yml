# Continuous checks for va-claims-prep.
#
# This project ships to veterans, is public, and is built around other
# people's medical records. Three classes of failure matter more here than
# a broken build:
#
#   PHI reaching a commit. It has nearly happened twice.
#   The browser build silently diverging from the source it was generated
#   from -- an unterminated string once shipped to production with a green
#   local suite, because nothing imports the module outside Pyodide.
#   Data going stale on a calendar: presumptive lists change by statute,
#   ICD-10 every October, and the forms get new editions that rename the
#   fields this tool writes to.
#
# The scheduled run exists for the third: nobody pushes to a repository on
# the day a list becomes wrong.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly. Catches the freshness checks without waiting for a commit.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The tool is used on whatever the member already owns. Windows is
        # the common case and was a late port; it stays covered.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          - {os: windows-latest, python: "3.11"}
          - {os: macos-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo-hygiene tests read git history, not just the worktree.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # Configured deliberately in pyproject.toml, including security rules,
      # because this project handles medical records. Every suppression in
      # the codebase carries a written reason.
      - name: Lint
        run: ruff check .

      # Failures are echoed as ::error:: so they appear in the run's
      # Annotations, which are readable without signing in. Without this the
      # only record of what broke is in the log, and reading the log of a
      # public repository still requires an account -- so a maintainer
      # without one, or anyone helping them, is reduced to guessing from a
      # red tick and a job name.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=short -rf 2>&1 | tee pytest.out || {
            # ONE annotation with encoded newlines, not many separate ones.
            # The previous version emitted a line per failure and GitHub
            # collapsed them to nothing but the title -- which is how a
            # Windows-only break stayed undiagnosable through two pushes.
            # Annotation titles render reliably; bodies do too, as long as
            # there is a single body with %0A for the line breaks.
            body=$(tail -40 pytest.out | python -c "import sys;print('%0A'.join(l.rstrip() for l in sys.stdin))")
            echo "::error title=pytest failed on ${{ matrix.os }} py${{ matrix.python }}::${body}"
            exit 1
          }

  build-is-current:
    # docs/form/py is generated. If someone edits a module and pushes without
    # rebuilding, the site serves the old one and nothing says so.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rebuild the browser bundle
        run: python tools/build_web.py
      - name: Fail if the committed build is out of date
        run: |
          if ! git diff --quiet; then
            echo "::error::The committed browser build is stale."
            echo "Run 'python tools/build_web.py && python tools/stamp_assets.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Browser build matches the source."

  browser:
    # The only tests that touch what people actually use: a page that boots a
    # WebAssembly runtime, writes fifteen modules into a virtual filesystem,
    # and runs the same Python there.
    #
    # This job now walks the entire flow with a synthetic record and asserts
    # the content of every screen, because reaching a screen proves nothing.
    # A rename that left step 3 rendering an empty checklist survived a week
    # in production while the whole Python suite passed, and the previous
    # version of this job stopped at "the engine boots".
    #
    # Verified by reintroducing that exact bug: the walk times out waiting
    # for the checklist, which is the failure a user would have seen.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright
          playwright install --with-deps chromium
      - name: Browser smoke test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/e2e -q --tb=short 2>&1 | tee e2e.out || {
            echo "::error title=Browser smoke test failed::the published flow does not load"
            grep -E '^(FAILED|E )' e2e.out | head -15 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

  links:
    # Government URLs move. They moved four times in one week during
    # development. A dead link on the dashboard sends somebody to a 404 at
    # the exact moment they were willing to act.
    runs-on: ubuntu-latest
    continue-on-error: true   # an external outage is not this repo's fault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tools/check_links.py
