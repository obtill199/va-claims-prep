# Tooling configuration.
#
# The rule selection below is deliberate rather than inherited. Each block
# says why it is on or off, because a linter configured by accident is worth
# about as much as no linter at all.

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".venv",
    # Generated by tools/build_web.py from the modules at the repo root.
    # Linting it would report every finding twice and tempt somebody to fix
    # the copy instead of the source.
    "docs/form/py",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names, dead code
    "I",        # import ordering
    "B",        # bugbear: mutable defaults, shadowed loop vars, real traps
    "SIM",      # simplifiable constructs
    "UP",       # constructs superseded by the target Python
    "RUF",      # ruff's own checks, including dead noqa directives
    "S",        # bandit: security. This project handles medical records
    "PIE", "PLW", "PLR0402",
]

ignore = [
    # Multi-line implicit concatenation inside the rule tables is the whole
    # reason those tables are readable. Every criteria entry in
    # rating_criteria.py and condition_library.py is written this way, on
    # purpose, and joining them would produce 200-character lines.
    "ISC003", "ISC004",

    # date.today() is correct here. Every date in this project is a local
    # calendar date on a government form -- separation dates, diagnosis
    # dates, filing deadlines. Attaching a timezone would be wrong, not
    # safer.
    "DTZ011", "DTZ007", "DTZ005",

    # Shebangs are kept on modules that are also runnable as scripts. The
    # executable bit is not tracked meaningfully across the platforms this
    # runs on.
    "EXE001",

    # assert is how the test suite works.
    "S101",

    # En dashes appear in diagnostic-code ranges shown to veterans
    # ("5235-5243" is written with an en dash because it is a range, not a
    # subtraction). Typographically correct, and the strings are prose read
    # by a person rather than parsed by anything.
    "RUF001", "RUF002", "RUF003",

    # `existing + [new]` reads more plainly than unpacking in the places
    # this codebase uses it, and none of them are hot paths.
    "RUF005",

    # Long docstrings and explanatory comments are intentional in this
    # codebase; the reasoning behind a rule matters more than its length.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals, bind values they do not use, and construct
# deliberately malformed input.
"tests/*" = ["S", "B011", "RUF059", "SIM115"]
# Developer tools run subprocesses and write files by design.
"tools/*" = ["S404", "S603", "S607", "SIM115"]
# The hosted prototype is deliberately unfinished; its stubs raise rather
# than implement, which several rules flag as suspicious. That is the point.
"hosted/*" = ["S104", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = [
    "coded_records", "condition_library", "explanations", "extract_conditions",
    "field_map", "fill_forms", "increase", "ingest", "intake", "ocr",
    "ocr_backends", "package_bundle", "pdf_io", "presumptives", "prompts",
    "proposals", "rating_criteria", "report_html", "schema", "secondary",
    "self_report", "timing",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:swig.*",
]
