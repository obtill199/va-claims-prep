[pytest]
# tests/e2e drives a real browser: it needs Playwright plus a downloaded
# Chromium, and booting Pyodide in it takes most of a minute. Running it by
# accident on a machine without the browser hangs rather than fails, which
# is a bad way to find out. CI runs it explicitly in its own job.
#
#     pytest                 -> the fast suite
#     pytest tests/e2e       -> the browser smoke test, if you have Chromium
addopts = --ignore=tests/e2e
testpaths = tests
